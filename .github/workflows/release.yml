name: release

# Rezuscloud Forgejo distribution release — upstream-identity versioning.
#
# This repo IS the Forgejo fork. It builds and releases as one unit:
#   - server image  : built from the repo root via Dockerfile / Dockerfile.rootless
#   - fj CLI binary : built from ./cmd/fj (the fj analogue of cmd/kubectl)
#   - Helm chart    : packaged from charts/forgejo-monorepo (vendored upstream + Rezuscloud overlay)
#
# VERSION IDENTITY (no hand-edited files, no hand-bumped counters):
#   identity   = the upstream version the release is based on (16.0.2)
#   provenance = +rezus.N semver build metadata (ignored
#                 for precedence/identity)
#   docker tag = 16.0.2-rezus.N  (docker forbids '+' — hyphen-encoded)
#   fingerprint= 16.0.2-rezus.N-<shortsha>
#   chart      = 18.0.2-rezus.N  (upstream forgejo-helm convention: chart N+2 → app N)
# The tag itself (v16.0.2-rezus.N) is cut by the fork-maintenance sync engine
# (auto-release) — a release TRIGGER, never an identity. Everything below is
# derived from it. distributions/ holds no version metadata anymore.
#
# PR VALIDATION (build + codegen + integration) runs centrally in the
# fork-maintenance workflow BEFORE the sync PR is merged. The fork repo keeps
# only tag-triggered release logic — no per-PR CI jobs here.

on:
  push:
    tags: ["v*-rezus.*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to derive versions from (e.g. v16.0.2-rezus.4)'
        required: true
        default: v16.0.2-rezus.1

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.meta.outputs.release_version }}
      version_file: ${{ steps.meta.outputs.version_file }}
      chart_version: ${{ steps.meta.outputs.chart_version }}
      image_repository: ${{ steps.meta.outputs.image_repository }}
      chart_repository: ${{ steps.meta.outputs.chart_repository }}
      chart_archive: ${{ steps.meta.outputs.chart_archive }}
      runner_upstream: ${{ steps.meta.outputs.runner_upstream }}
      runner_version: ${{ steps.meta.outputs.runner_version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag='${{ inputs.version }}'
          else
            tag="${GITHUB_REF_NAME}"
          fi
          # v16.0.2-rezus.4 → identity 16.0.2, provenance rezus.4
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)-rezus\.([0-9]+)$ ]] || {
            echo "ERROR: tag '$tag' does not match v<upstream>-rezus.<N>" >&2; exit 1; }
          identity="${BASH_REMATCH[1]}"
          n="${BASH_REMATCH[3]}"
          release_version="${identity}-rezus.${n}"     # docker-safe encoding
          version_file="${identity}+rezus.${n}"         # VERSION (semver build metadata)
          major="${identity%%.*}"
          rest="${identity#*.}"
          chart_version="$((major + 2)).${rest}-rezus.${n}"
          short_sha="$(git rev-parse --short=12 HEAD)"
          # vendored forgejo/runner (runner/, vendor-bump workflow): the runner
          # binaries keep their own version lineage — <upstream tag>-rezus.<N>
          runner_upstream="$(tail -1 runners/RUNNER_UPSTREAM | tr -d '[:space:]')"
          [[ "$runner_upstream" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "ERROR: runners/RUNNER_UPSTREAM is not a vX.Y.Z tag: '$runner_upstream'" >&2; exit 1; }
          runner_version="${runner_upstream#v}-rezus.${n}"
          # hard guard: an empty/short version would stamp binaries with a bare
          # "v" (silently — -X accepts any string); fail prepare instead
          [[ "$runner_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rezus\.[0-9]+$ ]] || {
            echo "ERROR: runner_version '$runner_version' is not <X.Y.Z>-rezus.<N>" >&2; exit 1; }
          {
            echo "release_version=$release_version"
            echo "version_file=$version_file"
            echo "chart_version=$chart_version"
            echo "runner_upstream=$runner_upstream"
            echo "runner_version=$runner_version"
            echo "image_repository=ghcr.io/rezuscloud/forgejo"
            echo "chart_repository=oci://ghcr.io/rezuscloud/charts"
            echo "chart_archive=forgejo-monorepo-${chart_version}.tgz"
            echo "short_sha=$short_sha"
          } >> "$GITHUB_OUTPUT"

  build-server-images:
    needs: prepare
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - name: Write VERSION (identity + provenance; Forgejo embeds its version from this)
        run: printf '%s\n' '${{ needs.prepare.outputs.version_file }}' > VERSION
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push server image (rootful)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_VERSION=${{ needs.prepare.outputs.release_version }}
          tags: |
            ${{ needs.prepare.outputs.image_repository }}:${{ needs.prepare.outputs.release_version }}
            ${{ needs.prepare.outputs.image_repository }}:${{ needs.prepare.outputs.release_version }}-${{ needs.prepare.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=forgejo (rezuscloud release)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.release_version }}
      - name: Build & push server image (rootless)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.rootless
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_VERSION=${{ needs.prepare.outputs.release_version }}
          tags: |
            ${{ needs.prepare.outputs.image_repository }}:${{ needs.prepare.outputs.release_version }}-rootless
            ${{ needs.prepare.outputs.image_repository }}:${{ needs.prepare.outputs.release_version }}-${{ needs.prepare.outputs.short_sha }}-rootless
          labels: |
            org.opencontainers.image.title=forgejo rootless (rezuscloud release)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.release_version }}

  build-cli:
    needs: prepare
    runs-on: ubuntu-latest
    permissions: { contents: read }
    strategy:
      matrix:
        # Parity with upstream forgejo-cli packaging (forgejo-contrib/forgejo-cli
        # .woodpecker/publish.yml + its binstall metadata): windows ships as a
        # zip, everything else as tar.gz. Coverage is a superset — upstream has
        # linux x86_64/aarch64 + windows x86_64; Go cross-compiles darwin and
        # windows/arm64 for free. Archive naming stays fj-{goos}-{goarch}.
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Build fj (versioned to the Forgejo release)
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          EXE=""; [[ "${{ matrix.goos }}" == windows ]] && EXE=".exe"
          mkdir -p dist out
          go build -mod=mod -trimpath -ldflags "-s -w -X 'forgejo.org/fj/pkg/cmd.cliVersion=${{ needs.prepare.outputs.version_file }}'" \
            -o "dist/fj-${{ matrix.goos }}-${{ matrix.goarch }}${EXE}" ./cmd/fj
      - name: Verify stamped version
        # Only verify the binary that can run on the amd64 runner; other
        # targets are cross-compiled and cannot execute here.
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: "./dist/fj-linux-${{ matrix.goarch }} version --client"
      - name: Archive (tar.gz on unix, zip on windows — upstream fj convention)
        shell: bash
        run: |
          set -euo pipefail
          EXE=""; [[ "${{ matrix.goos }}" == windows ]] && EXE=".exe"
          NAME="fj-${{ matrix.goos }}-${{ matrix.goarch }}${EXE}"
          if [[ "${{ matrix.goos }}" == windows ]]; then
            (cd dist && zip -q "../out/${NAME%.exe}.zip" "$NAME")
          else
            tar -C dist -czf "out/${NAME}.tar.gz" "$NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fj-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/

  build-runner:
    # forgejo/runner is vendored pristine at runner/ (vendor-bump workflow);
    # upstream ships linux-only release binaries, so the darwin pair is built
    # here alongside the rest of the release. Versionless asset names (like the
    # fj assets) — the version comes from the release tag; the binary stamps
    # its own lineage <upstream>-rezus.<N>.
    needs: prepare
    runs-on: ubuntu-latest
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          # verify-only leg: the only target that can execute on the runner —
          # proves the ldflags stamp; produces no artifact.
          - { goos: linux, goarch: amd64, verify_only: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: runner/go.mod }
      - name: Build forgejo-runner (stamped <upstream>-rezus.<N>)
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERPATH="$(go -C runner list -m)/internal/pkg/ver"
          # -C runner: all paths after it resolve relative to runner/, so the
          # output lands in the workspace-root dist/ via ../dist
          go build -C runner -tags 'netgo osusergo' -trimpath \
            -ldflags "-s -w -X ${VERPATH}.version=v${{ needs.prepare.outputs.runner_version }}" \
            -o "../dist/forgejo-runner-${{ matrix.goos }}-${{ matrix.goarch }}" .
      - name: Verify stamped version (linux/amd64 only)
        # Non-tautological: derive the expectation from the pin file, not from
        # the same (possibly empty) needs-context the ldflags used.
        if: matrix.verify_only
        run: |
          set -euo pipefail
          EXPECT="v$(tail -1 runners/RUNNER_UPSTREAM | tr -d '[:space:]' | sed 's/^v//')-rezus.$(echo '${{ needs.prepare.outputs.release_version }}' | sed 's/.*-rezus\.//')"
          OUT="$(./dist/forgejo-runner-linux-amd64 --version)"
          echo "$OUT"
          echo "$OUT" | grep -qx "forgejo-runner version $EXPECT"
          echo "$OUT" | grep -Eq 'version v[0-9]+\.[0-9]+\.[0-9]+-rezus\.[0-9]+$'
      - name: Archive
        if: ${{ !matrix.verify_only }}
        shell: bash
        run: |
          set -euo pipefail
          NAME="forgejo-runner-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p out
          tar -C dist -czf "out/${NAME}.tar.gz" "${NAME}"
          ( cd out && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.verify_only }}
        with:
          name: runner-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/

  build-repo-map:
    needs: prepare
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Generate Repository Intelligence Graph (RIG)
        uses: tibrezus/llm-wiki/.github/actions/repo-map@2b22cbe6273aac7ad9fe9e88f3452947c54f2d81
        with:
          language: go
          repo-path: .
          output-file: repo-map.json
          focus-package-prefixes: |
            forgejo.org/cmd/fj
            forgejo.org/client-go
            forgejo.org/fj
      - uses: actions/upload-artifact@v4
        with:
          name: repo-map
          path: repo-map.json

  publish-chart-and-release:
    needs: [prepare, build-server-images, build-cli, build-runner, build-repo-map]
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: "v3.16.0" }
      - run: helm dependency build charts/forgejo-monorepo
      - name: Package chart
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package charts/forgejo-monorepo \
            --version '${{ needs.prepare.outputs.chart_version }}' \
            --app-version '${{ needs.prepare.outputs.release_version }}' \
            --destination dist
      - name: Push chart to GHCR (Helm OCI)
        # Best-effort: the ghcr.io/rezuscloud/charts OCI package must exist
        # (created/linked by an org owner) for the GITHUB_TOKEN to push here.
        # The packaged chart tgz is still attached to the GitHub Release below
        # regardless, so a 403 here must not block the release.
        continue-on-error: true
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
          helm push dist/${{ needs.prepare.outputs.chart_archive }} '${{ needs.prepare.outputs.chart_repository }}'
      - uses: actions/download-artifact@v4
        with: { pattern: fj-cli-*, merge-multiple: true, path: dist-cli }
      - uses: actions/download-artifact@v4
        with: { pattern: runner-*, merge-multiple: true, path: dist-runner }
      - uses: actions/download-artifact@v4
        with: { name: repo-map, path: dist-rig }
      - name: CLI checksums
        # sha256 over every fj archive (tar.gz + zip) — the release ships six
        # binaries across three OSes; checksums make them verifiable. Both
        # groups land in ONE merged asset: GitHub release assets are a flat
        # namespace, so two same-named files overwrite each other — that is
        # exactly how the runner file silently replaced the fj entries since
        # rezus.3 (#125).
        run: cd dist-cli && sha256sum fj-* > ../checksums.txt && cat ../checksums.txt
      - name: Runner checksums (appended into the merged asset)
        run: cd dist-runner && sha256sum forgejo-runner-*.tar.gz >> ../checksums.txt && cat ../checksums.txt
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ needs.prepare.outputs.chart_archive }}
            dist-cli/fj-*.tar.gz
            dist-cli/fj-*.zip
            checksums.txt
            dist-runner/forgejo-runner-*.tar.gz
            dist-runner/forgejo-runner-*.tar.gz.sha256
            dist-rig/repo-map.json
          generate_release_notes: true
          body: |
            Rezuscloud Forgejo distribution release (this repo is the Forgejo fork).

            All artifacts share the same version:
            - server image: `${{ needs.prepare.outputs.image_repository }}:${{ needs.prepare.outputs.release_version }}` (+ `-rootless`)
            - fj CLI (Client Version matches the release): `fj-{linux,darwin}-{amd64,arm64}.tar.gz`, `fj-windows-{amd64,arm64}.zip` — all listed in `checksums.txt`
            - forgejo-runner binaries (vendored at `runner/`, stamped `${{ needs.prepare.outputs.runner_version }}`): `forgejo-runner-darwin-{amd64,arm64}.tar.gz` — also listed in `checksums.txt` (linux fleet uses the upstream OCI image)
            - OCI Helm chart: `${{ needs.prepare.outputs.chart_repository }}/forgejo:${{ needs.prepare.outputs.chart_version }}` (appVersion = release version)
            - Repository Intelligence Graph (RIG): `repo-map.json` (deterministic architecture graph for the wiki C4D2 workflow)

            k8s-style monorepo layout — see `staging/README.md`.
