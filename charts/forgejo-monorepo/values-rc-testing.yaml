## values-rc-testing.yaml — non-production overlay for deploying a Forgejo RC
## build for testing. Apply on top of the chart defaults:
##
##   helm install forgejo-test \
##     oci://ghcr.io/rezuscloud/forgejo-monorepo-charts/forgejo \
##     --version 18.0.0-rc.1 \
##     -n forgejo-test --create-namespace \
##     -f values-rc-testing.yaml
##
## This mirrors the official chart's value schema; override ROOT_URL to a test
## hostname and pin a single replica. Adjust image.tag to test a specific build.

image:
  rootless: true
  # Leave empty to use Chart.appVersion (the current RC). To pin an exact
  # immutable RC build, set a tag that already includes the -rootless suffix:
  # tag: "16.0.0-rc.1-cbafedda0ae0-rootless"
  tag: ""

strategy:
  type: Recreate

replicaCount: 1

persistence:
  enabled: true
  size: 10Gi

gitea:
  config:
    server:
      # Distinct test hostname so this instance never shadows production.
      DOMAIN: forgejo-test.local
      ROOT_URL: http://forgejo-test.local:3000/
    log:
      LEVEL: Debug
    service:
      # Allow fast re-provisioning in test without external mail setup.
      DISABLE_REGISTRATION: "false"
