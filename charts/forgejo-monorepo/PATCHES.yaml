# =============================================================================
# Patch contract for the Rezuscloud chart at charts/forgejo-monorepo/
# =============================================================================
# Single source of truth for the ALLOWED delta between this chart and the
# upstream forgejo-helm chart at the version pinned in UPSTREAM_CHART (same
# directory). Read by the patch-accounting guard that runs inline in
# .github/workflows/vendored-guards.yml.
#
# Rule: every difference must be declared here. A differing file that is not
# listed, or a listed file whose signature is absent, is RED (unaccounted
# drift — re-vendor via the vendor-bump workflow). A declared patch that no
# longer differs is a WARN (stale entry: upstream absorbed it, or the patch
# was dropped — resolve). Locally-added paths must be preserved; upstream
# paths must never go missing.
# =============================================================================

# Locally-added paths (exact file at the chart root, or a directory with a
# trailing slash). These survive re-vendoring (the vendor-bump workflow
# backs them up across the swap; directory contents are restored after).
preserve:
  - PATCHES.yaml            # this contract
  - UPSTREAM_CHART          # the pin this contract is verified against
  - REZUSCLOUD.md           # this distribution's docs (drop-in contract)
  - values-rc-testing.yaml  # RC-channel values overlay
  - charts/                 # vendored dependency tarballs (Chart.lock deps; upstream ships none)

# Files that differ from upstream. Each must still carry its signature —
# proof the patch is applied and accounted for.
patches:
  - path: Chart.yaml
    signature: github.com/rezuscloud/forgejo-monorepo
    description: >-
      name forgejo-monorepo; home/sources point at the Rezuscloud monorepo;
      version + appVersion carry the LOCAL release line (chart N+2 → app N,
      independent of the upstream pin — set by release.yml).
  - path: values.yaml
    signature: rezuscloud/forgejo
    description: >-
      default image from GHCR (drop-in default: every upstream value still
      works); header documents the vendoring + this contract.
